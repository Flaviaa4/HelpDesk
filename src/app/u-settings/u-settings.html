<div class="page-wrap">
  <div class="header">
    <div class="header-logo">
      <img src="user-logo.png" alt="IT HelpDesk">
    </div>

    <div class="header-profile"
         (click)="toggleProfile(); $event.stopPropagation()">

      <div class="avatar-circle">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#ffffff">
          <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
        </svg>
      </div>

      <svg class="header-chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M7 10l5 5 5-5z"/>
      </svg>

      <div class="profile-dropdown" *ngIf="profileOpen">
        <div class="profile-dropdown-header">
          <div class="profile-dropdown-name">{{ userName }}</div>
        </div>

      <a class="dropdown-item" routerLink="/u-profile">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="ffffff">
          <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
        </svg>
        Profile
      </a>

      <button class="dropdown-item danger" (click)="logout()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
        </svg>
          Sign out
      </button>
      </div>

    </div>
  </div>

  <div class="page-body">

    <div class="sidebar">

      <a class="nav-item"
         routerLink="/user-dashboard">
        Dashboard
      </a>

      <a class="nav-item"
         routerLink="/submit-ticket">
        Submit Ticket
      </a>

      <a class="nav-item"
         routerLink="/ticket-history">
        Ticket History
      </a>

      <div class="sidebar-illustration">
        <img src="avatar.jpg" alt="support illustration" />
      </div>

    </div>
    <div class="content">

  <div class="page-header">
    <h1>Settings</h1>
    <p>Manage your account preferences and system configuration.</p>
  </div>

  <div class="top-row">

    <div class="settings-card">

      <h2>Notifications</h2>

      <div class="setting-row">
        <span>Email Notifications</span>
        <input type="checkbox">
      </div>

      <div class="setting-row">
        <span>New Ticket Alerts</span>
        <input type="checkbox">
      </div>

      <div class="setting-row">
        <span>Ticket Status Updates</span>
        <input type="checkbox">
      </div>

      <div class="setting-row">
        <span>System Alerts</span>
        <input type="checkbox" checked>
      </div>

      <button class="primary-btn">
        Save Changes
      </button>

    </div>
    <div class="settings-card">

      <h2>Change Password</h2>

      <div class="form-group">
        <label>New Password</label>
        <input type="password">
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password">
      </div>

      <button class="primary-btn">
        Change Password
      </button>

    </div>

  </div>

  <div class="settings-card system-card">

    <h2>System Preferences</h2>

    <div class="preferences-grid">

      <div class="form-group">
        <label>Language</label>
        <select>
          <option>English</option>
          <option>French</option>
          <option>Kinyarwanda</option>
        </select>
      </div>

      <div class="form-group">
        <label>Timezone</label>
        <select>
          <option>Africa/Kigali (GMT+2)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Date Format</label>
        <select>
          <option>DD-MM-YYYY</option>
          <option>MM-DD-YYYY</option>
          <option>YYYY-MM-DD</option>
        </select>
      </div>

    </div>

    <button class="primary-btn">
      Save Preferences
    </button>

    <button class="secondary-btn">
      Reset to Default
    </button>

  </div>

</div>

  </div>

</div>
<div class="bottom-nav">
    <a class="bottom-nav-item" routerLink="/user-dashboard">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
      </svg>
      Dashboard
    </a>
    <a class="bottom-nav-item active" routerLink="/submit-ticket">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.4-1.4L12 14.2l7.6-7.6L21 8l-9 9z"/>
      </svg>
      Submit
    </a>
    <a class="bottom-nav-item" routerLink="/ticket-history">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
      </svg>
      History
    </a>
</div>
