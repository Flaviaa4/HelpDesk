<div class="signup-page">

  <div class="blob blob-top-left"></div>
  <div class="blob blob-top-right"></div>
  <div class="blob blob-bottom-center"></div>

  <div class="header">
    <img
      src="UserLogo.png"
      alt=""
      class="header-logo"
    />
  </div>

  <div class="signup-wrap">
    <div class="card">

      <div class="card-title">
        <img src="User-Logo.png" alt="IT HelpDesk Logo" class="header-logo" />
      </div>


      <div class="input-group">
        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#14396A">
          <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
        </svg>
        <input class="input-field" type="text" placeholder="Username" [(ngModel)]="username" />
      </div>

      <div class="input-group">
        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#14396A">
          <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
        </svg>
        <input class="input-field" type="email" placeholder="Email" [(ngModel)]="email" />
      </div>

      <div class="input-group">
        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#14396A">
          <path d="M18 8h-1V6c0-2.8-2.2-5-5-5S7 3.2 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.7 1.4-3.1 3.1-3.1 1.7 0 3.1 1.4 3.1 3.1v2z"/>
        </svg>
        <input class="input-field" type="password" placeholder="Password" [(ngModel)]="password" />
      </div>

      <div class="remember-row">
        <label class="remember-me">
          <input type="checkbox" />
          Remember Me
        </label>
      </div>

      <div class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</div>
<button class="btn-signup" (click)="register()">Sign up</button>

  </div>

</div>
