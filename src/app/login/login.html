<div class="login-page">

  <div class="blob blob-top-left"></div>
  <div class="blob blob-top-right"></div>
  <div class="blob blob-bottom-center"></div>

  <div class="header">
    <img
      src="UserLogo.png"
      alt=""
      class="header-logo"
    />
  </div>

  <div class="login-wrap">
    <div class="card">

      <div class="card-title">
        <img
      src="user-logo.png"
      alt=""
      class="header-logo"
    />
      </div>
      <div class="input-group">
        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#14396A">
          <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
        </svg>
        <input class="input-field" type="email" placeholder="Email" [(ngModel)]="username" />
      </div>

      <div class="input-group">

      <app-hide-show [(password)]="password" placeholder="Password"> </app-hide-show>

       <input class="input-field" [type]="showPassword ? 'text' : 'password'"placeholder="Password" [(ngModel)]="password"/>
         <svg class="eye-icon" (click)="togglePassword()" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#14396A">
           <path *ngIf="!showPassword" d="M12 5c-7 0-11 7-11 7s4 7 11 7 11-7 11-7-4-7-11-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z" />
           <path *ngIf="showPassword" d="M2 5.27 3.28 4 20 20.72 18.73 22l-3.2-3.2A11.6 11.6 0 0 1 12 19C5 19 1 12 1 12a21.8 21.8 0 0 1 5.17-5.91L2 5.27zM12 7a5 5 0 0 1 5 5c0 .69-.14 1.35-.39 1.95l-1.53-1.53A3 3 0 0 0 11.58 9.3L9.97 7.69A4.96 4.96 0 0 1 12 7zm10 4.73a21.8 21.8 0 0 1-3.69 4.55l-1.42-1.42A17.9 17.9 0 0 0 20.17 12S16.17 5 12 5c-.84 0-1.66.11-2.44.31L8 3.75A11.6 11.6 0 0 1 12 5c7 0 11 7 11 7-.23.39-.56.96-1 1.73z" />
         </svg>
      </div>

      <div class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</div>
         <button class="btn-login" (click)="login()">Sign In</button>

      <div class="footer-row">
        <label class="remember-me">
          <input type="checkbox" />
          Remember Me
        </label>
        <span class="forgot-link">Forget password?</span>
      </div>

      <div class="signup-row">
        Not a member yet ? <a routerLink="/signup">Sign up</a>
      </div>

    </div>
  </div>

</div>
