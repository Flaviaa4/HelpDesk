<button class="chat-btn" (click)="toggleChat()">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
    <path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-2 10H6v-2h12v2zm0-3H6V7h12v2zm-4 6H6v-2h8v2z"/>
  </svg>
</button>

<div class="chat-window" *ngIf="chatOpen">

  <div class="chat-header">
    <span>HelpDesk Support</span>

    <button class="close-btn" (click)="toggleChat()">
      ✕
    </button>
  </div>

  <div class="chat-body">

    <div
      *ngFor="let msg of messages"
      class="message"
      [class.user]="msg.sender === 'user'"
      [class.admin]="msg.sender === 'admin'">

      {{ msg.text }}

    </div>

  </div>

  <div class="chat-footer">

    <input
      type="text"
      placeholder="Type a message..."
      [(ngModel)]="newMessage"
      (keyup.enter)="sendMessage()">

    <button (click)="sendMessage()">
      Send
    </button>

  </div>

</div>
