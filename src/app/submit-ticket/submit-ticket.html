<div class="page-wrap">

  <app-header [userName]="userName" [role]="role" (logout)="logout()"></app-header>

  <div class="page-body">

    <app-sidebar [role]="role"></app-sidebar>

    <div class="main">

      <div class="form-header">
        <div class="form-title">Submit a Ticket</div>
        <div class="form-subtitle">Report an IT issue</div>
      </div>

      <div class="form-card">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Issue Title :</label>
            <input
              class="form-control"
              type="text"
              placeholder="Enter issue title"
              [(ngModel)]="title"
              (input)="onTitleChange()"
            />
          </div>
          <div class="form-group">
            <label class="form-label">Date of creation :</label>
            <input class="form-control" type="date" [(ngModel)]="createdOn" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Category :</label>
            <select class="form-control" [(ngModel)]="category">
              <option value="">Select Category</option>
              <option>Hardware</option>
              <option>Software</option>
              <option>Network</option>
              <option>Email</option>
              <option>Other</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">
              Priority :
              <span class="priority-auto" *ngIf="priority">(auto-detected)</span>
            </label>
            <select class="form-control" [(ngModel)]="priority">
              <option value="">low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>

        <div class="form-group-full">
          <label class="form-label">Select Department :</label>
          <select class="form-control" [(ngModel)]="selectedDepartment" style="max-width: 300px;">
            <option value="">Choose a department</option>
            <option *ngFor="let dept of departments" [value]="dept">{{ dept }}</option>
          </select>
        </div>

        <div class="form-group-full">
          <label class="form-label">Description</label>
          <textarea
            class="form-control"
            placeholder="Describe your Issue"
            [(ngModel)]="description"
            (input)="onTitleChange()">
          </textarea>
        </div>

        <div class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</div>
        <div class="success-msg" *ngIf="successMsg">{{ successMsg }}</div>

        <div class="btn-row">
          <button class="btn-submit" (click)="submitTicket()" [disabled]="loading">
            {{ loading ? 'Submitting...' : 'Submit ticket' }}
          </button>
          <button class="btn-cancel" routerLink="/submit-ticket">Cancel</button>
        </div>

      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <a class="bottom-nav-item" routerLink="/user-dashboard">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
      </svg>
      Dashboard
    </a>
    <a class="bottom-nav-item active" routerLink="/submit-ticket">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.4-1.4L12 14.2l7.6-7.6L21 8l-9 9z"/>
      </svg>
      Submit
    </a>
    <a class="bottom-nav-item" routerLink="/ticket-history">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
      </svg>
      History
    </a>
  </div>

</div>
