<div class="page-wrap">
  <div class="header">
    <div class="header-user">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#14396A">
        <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
      </svg>
      <span class="header-username">User</span>
    </div>
    <div class="header-logo">
      <img src="User-Logo.png" alt="IT HelpDesk" />
    </div>
  </div>
  <div class="main">

    <div class="blob blob-left"></div>
    <div class="blob blob-right"></div>

    <div class="form-header">
      <div class="form-title">Submit a Ticket</div>
      <div class="form-subtitle">Report an IT issue</div>
    </div>

    <div class="form-card">

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Issue Title :</label>
          <input class="form-control" type="text" placeholder="" />
        </div>
        <div class="form-group">
          <label class="form-label">Date of creation :</label>
          <input class="form-control" type="date" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Category :</label>
          <select class="form-control">
            <option value="">Select Category</option>
            <option>Hardware</option>
            <option>Software</option>
            <option>Network</option>
            <option>Email</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Priority :</label>
          <select class="form-control">
            <option value="">Select Priority</option>
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
          </select>
        </div>
      </div>

      <div class="form-group-full">
        <label class="form-label">Description</label>
        <textarea
          class="form-control"
          placeholder="Describe your Issue">
        </textarea>
      </div>

    </div>

    <div class="btn-row">
      <button class="btn-submit">Submit ticket</button>
      <button class="btn-cancel" routerLink="/user-dashboard">Cancel</button>
    </div>

  </div>
</div>
